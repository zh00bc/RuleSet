name: Update AI rules

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/update-ai.yml
  pull_request:
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/update-ai.yml

concurrency:
  group: ai-rules-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test failure handling and coverage
        run: python3 -m unittest discover -s tests -v
      - name: Fetch and validate all upstreams
        run: python3 scripts/build_ai.py
      - name: Publish validated rule changes
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git add Rules/AI-Sukka.list Rules/AI-Supplement.list Rules/AI-Voice-IP.list Rules/AI-Sources.json
          if git diff --cached --quiet; then
            echo "No upstream changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update validated AI rules'
          git push origin HEAD:main
